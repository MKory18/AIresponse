<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80" fill="none" stroke="#000" stroke-width="1.25" stroke-linejoin="round" stroke-linecap="round">
  <!-- بلاطة هندسية متكرّرة: نجمة ثمانية (مربّعان متراكبان — «ختم سليمان»/ربع الحزب) + نجمة داخلية +
       معيّنات بالزوايا + أذرع تربط كل شي بالمشبّك. 80×80 قابلة للتكرار بلا خط وصل.
       الألوان بتجي من CSS (mask) — هون الأسود بس للقناع (alpha). -->
  <polygon points="40,16 47,23 57,23 57,33 64,40 57,47 57,57 47,57 40,64 33,57 23,57 23,47 16,40 23,33 23,23 33,23"/>
  <polygon points="40,28 43.5,31.5 48.5,31.5 48.5,36.5 52,40 48.5,43.5 48.5,48.5 43.5,48.5 40,52 36.5,48.5 31.5,48.5 31.5,43.5 28,40 31.5,36.5 31.5,31.5 36.5,31.5"/>
  <circle cx="40" cy="40" r="2.2" fill="#000" stroke="none"/>
