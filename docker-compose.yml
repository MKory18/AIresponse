# ── Production stack (also used as the Coolify "Docker Compose" resource) ──
# Usage: docker compose up -d --build
# Postgres runs with the pgvector extension enabled (used for RAG in Phase 3+).
#
# Environment precedence per service (highest wins):
#   1. variables injected by the platform (Coolify UI / shell export) —
#      ALWAYS win via ${VAR:-default} interpolation below;
#   2. `.env` file in the repo root when present (local runs);
#   3. the `:-default` fallbacks (local development only).
# The `.env` file is optional (`required: false`): platforms that inject
# environment themselves (Coolify) check out the repo WITHOUT a `.env` file,
# and a required env_file would fail the entire deployment with
# "env file not found" — taking the worker down with it.
#
services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/ai_commerce?schema=public}
    env_file:
      - path: .env
        required: false
    volumes:
      - storage:/app/.data/storage
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    # Every worker replica opens its own pool: keep this above
    # (web + WORKER_PROCESSES) × pool + 20 (docs/COOLIFY-STAGING.md → Capacity).
    command: postgres -c max_connections=${POSTGRES_MAX_CONNECTIONS:-200}
    environment:
      POSTGRES_USER: postgres
      # OCR-2026-10-16: بلا كلمة مرور افتراضية عامة — POSTGRES_PASSWORD
      # إجباري من بيئة الإنتاج (فشل صريح بدل postgres/postgres المكشوف).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the deployment environment}
      POSTGRES_DB: ai_commerce
    ports:
      # OCR-2026-10-16: المحرك محلي فقط — الخدمة بين الحاويات على الشبكة
      # الداخلية (Coolify أو أي راوتر عكسي) ما تحتاج فتح المنفذ عامًا.
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./prisma/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Dedicated worker: webhook events, AI jobs, outbound recovery, follow-ups.
  # Same image + same DATABASE_URL + same secrets as `app`, shared storage
  # volume (process_media reads asset bytes; signed-URL generation is DB-only).
  # No ports, no HTTP healthcheck (non-HTTP process — liveness is visible via
  # the `worker_started` log line). Never runs inside the Next.js process.
  worker:
    build: .
    command: sh -c "npx prisma migrate deploy && npm run worker"
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/ai_commerce?schema=public}
      # Total AI capacity = WORKER_PROCESSES × AI_JOB_CONCURRENCY. Processes, not
      # Compose replicas: Coolify cannot run replicas of a Compose service.
      WORKER_PROCESSES: ${WORKER_PROCESSES:-4}
      AI_JOB_CONCURRENCY: ${AI_JOB_CONCURRENCY:-16}
    volumes:
      - storage:/app/.data/storage
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  storage:
