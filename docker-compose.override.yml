# ملف محلي فقط (غير مرفوع) — Docker بيقرأه تلقائيًا مع docker-compose.yml.
# سببه: عند المالك Postgres 16 محلي شغّال على 5432، فلو الحاوية حجزت نفس
# المنفذ ما بتقلع. `!override` بتبدّل قائمة المنافذ كاملة بدل ما تضيف عليها.
# التطبيق والعامل بيوصلوا القاعدة بالاسم الداخلي postgres:5432 على شبكة
# Docker — المنفذ 5433 للفحص من الجهاز بس.
services:
  postgres:
    ports: !override
      - "127.0.0.1:5433:5432"
